[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-guard"
version = "1.0.0"
description = "A two-layer PII detection pre-commit hook using regex and optional LLM analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.25.0"]

[project.scripts]
pii-guard = "pii_guard.hook:main"

[tool.setuptools.packages.find]
include = ["pii_guard*"]

[tool.setuptools.package-data]
pii_guard = ["data/*.yaml", "data/*.json"]
